# Override que faz os Nós falarem pelo Toxiproxy. Reescreve os endereços de peer para as escutas do
# Toxiproxy sem tocar o código dos algoritmos, porque o endereçamento é todo por variável de
# ambiente. As portas casam com src/comum/toxiproxy.py:
#
#   Anel: no-anel-i                 via toxiproxy:(16000 + i)  -> no-anel-i:8000
#   2PC:  coordenador               via toxiproxy:17000        -> coordenador:8000
#         participante de id p      via toxiproxy:(17000 + p)  -> participante-(p - 10):8000
#
# Os Nós só se alcançam depois que os proxies existem. O fluxo é subir, semear e só então
# disparar o algoritmo:
#   docker compose -f compose.yaml -f compose.toxiproxy.yaml up -d --wait
#   python -m scripts.rede anel semear
#   python -m scripts.rede anel particionar --no 5

services:
  # ---- Anel: cada Nó repassa ao Sucessor via o proxy do destino -------------
  # URLS aponta para as escutas do Toxiproxy, uma por Nó. O ANEL (ordem
  # cíclica) e o NO_ID de cada serviço vêm do compose.yaml.
  no-anel-1:
    environment:
      URLS: "1=http://toxiproxy:16001,2=http://toxiproxy:16002,3=http://toxiproxy:16003,4=http://toxiproxy:16004,5=http://toxiproxy:16005"
  no-anel-2:
    environment:
      URLS: "1=http://toxiproxy:16001,2=http://toxiproxy:16002,3=http://toxiproxy:16003,4=http://toxiproxy:16004,5=http://toxiproxy:16005"
  no-anel-3:
    environment:
      URLS: "1=http://toxiproxy:16001,2=http://toxiproxy:16002,3=http://toxiproxy:16003,4=http://toxiproxy:16004,5=http://toxiproxy:16005"
  no-anel-4:
    environment:
      URLS: "1=http://toxiproxy:16001,2=http://toxiproxy:16002,3=http://toxiproxy:16003,4=http://toxiproxy:16004,5=http://toxiproxy:16005"
  no-anel-5:
    environment:
      URLS: "1=http://toxiproxy:16001,2=http://toxiproxy:16002,3=http://toxiproxy:16003,4=http://toxiproxy:16004,5=http://toxiproxy:16005"

  # ---- 2PC: Coordenador <-> Participantes via o Toxiproxy -------------------
  # O Coordenador alcança cada Participante pela escuta dele, e os Participantes alcançam o
  # Coordenador pela 17000. Votos e prazos vêm do compose.yaml e do override que a bateria do 2PC
  # empilha sobre este arquivo (override_2pc).
  coordenador:
    environment:
      DOISPC_PARTICIPANTES: "11@toxiproxy:17011,12@toxiproxy:17012,13@toxiproxy:17013"
  participante-1:
    environment:
      COORD_HOST: "toxiproxy"
      COORD_PORTA: "17000"
  participante-2:
    environment:
      COORD_HOST: "toxiproxy"
      COORD_PORTA: "17000"
  participante-3:
    environment:
      COORD_HOST: "toxiproxy"
      COORD_PORTA: "17000"
