# Orquestração do Trabalho 2 — Docker Compose v2.
#
# Este arquivo é dividido em seções independentes, uma por algoritmo, para que a
# frente do Anel e a frente do 2PC evoluam sem colisão:
#
#   - Seção ELEIÇÃO EM ANEL (tarefa 4): serviços `no-anel-1` .. `no-anel-5` na
#     rede dedicada `rede-anel`. É a seção definida aqui.
#   - Seção TWO-PHASE COMMIT (tarefa 6): o Coordenador e os Participantes, com
#     sua própria rede e volumes de Log_Duravel, acrescentados de forma
#     independente abaixo, sem alterar nem depender dos serviços do Anel.
#
# Todos os serviços compartilham a MESMA imagem (ver Dockerfile): o algoritmo de
# cada contêiner é escolhido pelo `command`. A topologia do Anel (quem é o
# Sucessor de quem) vem por variável de ambiente — nunca embutida no código
# (Requisito 5.2). Os cinco Nós sobem numa rede dedicada e, após disparar uma
# eleição em qualquer um, todos convergem para o maior id (Requisitos 5.3, 5.4).

# Âncoras YAML com a configuração comum aos Nós do Anel. A base define imagem,
# comando e rede; o bloco de ambiente define o ANEL e o mapa de URLS, idênticos
# para todos os Nós. Cada serviço acrescenta apenas o seu NO_ID.
x-no-anel-env: &no-anel-env
  ANEL: "1,2,3,4,5"
  URLS: "1=http://no-anel-1:8000,2=http://no-anel-2:8000,3=http://no-anel-3:8000,4=http://no-anel-4:8000,5=http://no-anel-5:8000"
  PORTA: "8000"
  DEADLINE: "1.0"
  RETRIES: "2"
  SEMENTE: "0"

x-no-anel-base: &no-anel-base
  build:
    context: .
    dockerfile: Dockerfile
  image: mc714-t2:latest
  command: ["python", "-m", "src.anel"]
  networks:
    - rede-anel
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 2s
  restart: "no"

services:
  # ----------------------------------------------------------------------
  # SEÇÃO: ELEIÇÃO EM ANEL (tarefa 4)
  # Cinco Nós formando o anel 1 -> 2 -> 3 -> 4 -> 5 -> 1. A porta de cada Nó é
  # publicada em 8001..8005, para que `curl`/testes a alcancem da máquina host.
  # ----------------------------------------------------------------------
  no-anel-1:
    <<: *no-anel-base
    container_name: no-anel-1
    environment:
      <<: *no-anel-env
      NO_ID: "1"
    ports:
      - "8001:8000"

  no-anel-2:
    <<: *no-anel-base
    container_name: no-anel-2
    environment:
      <<: *no-anel-env
      NO_ID: "2"
    ports:
      - "8002:8000"

  no-anel-3:
    <<: *no-anel-base
    container_name: no-anel-3
    environment:
      <<: *no-anel-env
      NO_ID: "3"
    ports:
      - "8003:8000"

  no-anel-4:
    <<: *no-anel-base
    container_name: no-anel-4
    environment:
      <<: *no-anel-env
      NO_ID: "4"
    ports:
      - "8004:8000"

  no-anel-5:
    <<: *no-anel-base
    container_name: no-anel-5
    environment:
      <<: *no-anel-env
      NO_ID: "5"
    ports:
      - "8005:8000"

  # ----------------------------------------------------------------------
  # SEÇÃO: TWO-PHASE COMMIT (tarefa 6)
  # Um Coordenador e três Participantes na rede dedicada `rede-2pc`. Todos usam a
  # MESMA imagem do Anel (o papel é escolhido por `DOISPC_PAPEL`), de modo que o
  # build permaneça único e compartilhado (Dockerfile comum). Cada Participante
  # monta um volume nomeado próprio em /dados para o seu Log_Duravel
  # (Requisito 7.2), o que preserva a Decisao através de reinícios do contêiner
  # (Requisito 6.6). Os Deadlines de Voto e de Decisao são configuráveis por
  # variável de ambiente (Requisito 7.5, 7.6). O Participante 3 vota NAO por
  # padrão da flag para demonstrar o ABORT atômico (Requisito 7.4); troque
  # DOISPC_VOTO para SIM para o cenário de COMMIT em todos.
  coordenador:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: coordenador
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "coordenador"
      COORD_ID: "1"
      COORD_HOST: "0.0.0.0"
      COORD_PORTA: "8000"
      # Mapa id@host:porta dos Participantes (ids 11, 12, 13).
      DOISPC_PARTICIPANTES: "11@participante-1:8000,12@participante-2:8000,13@participante-3:8000"
      # Deadlines configuráveis (Requisito 7.6). O de Voto limita a coleta e,
      # ao estourar, o Coordenador decide ABORT (Requisito 7.5).
      DOISPC_DEADLINE_VOTO: "3.0"
      DOISPC_DEADLINE_DECISAO: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/coordenador.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-coordenador:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    depends_on:
      participante-1:
        condition: service_healthy
      participante-2:
        condition: service_healthy
      participante-3:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: "no"

  participante-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-1
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "11"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      DOISPC_VOTO: "SIM"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-11.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-1:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8011:8000"
    restart: "no"

  participante-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-2
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "12"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      DOISPC_VOTO: "SIM"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-12.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-2:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8012:8000"
    restart: "no"

  participante-3:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-3
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "13"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      # Vota NAO por padrão: demonstra o ABORT atômico (Requisito 7.4). Para o
      # cenário de COMMIT em todos, suba com DOISPC_VOTO=SIM neste serviço.
      DOISPC_VOTO: "NAO"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-13.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-3:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8013:8000"
    restart: "no"

  # ----------------------------------------------------------------------
  # SEÇÃO: FALHAS DE REDE — TOXIPROXY (tarefa 8)
  # Um único serviço Toxiproxy ligado às DUAS redes (rede-anel e rede-2pc) atua
  # como proxy TCP entre os Nós: cada Nó, quando reconfigurado para falar pelos
  # proxies, aponta para uma porta de escuta do Toxiproxy, que repassa ao peer
  # real. Sobre esses proxies aplicam-se toxics (latência, perda) e, derrubando
  # o proxy, modela-se partição de rede (Requisito 9.1).
  #
  # Por padrão o serviço apenas FICA DE PÉ e expõe o HTTP API em 8474; os Nós do
  # Anel e do 2PC continuam falando DIRETO entre si (o Toxiproxy não intercepta
  # nada enquanto nenhum proxy é semeado e nenhum env é reescrito). Para rotear
  # o tráfego pelos proxies, suba com o override `compose.toxiproxy.yaml`, que
  # reescreve URLS/DOISPC_PARTICIPANTES/COORD_HOST dos Nós. Essa separação
  # preserva os serviços e testes das tarefas 4 e 6 intactos.
  #
  # A imagem é pinada numa versão específica (sem :latest) para reprodutibilidade.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    # Sobe o servidor com o HTTP API ouvindo em todas as interfaces, para que os
    # scripts na máquina host (via porta publicada) e os Nós nas redes internas
    # alcancem tanto o API quanto as portas de escuta dos proxies.
    command: ["-host", "0.0.0.0"]
    networks:
      - rede-anel
      - rede-2pc
    # Publica o HTTP API (8474) no host para o `scripts/rede.py` semear proxies e
    # aplicar toxics de fora do compose. As portas de escuta dos proxies não
    # precisam ser publicadas: o tráfego entre Nós é interno às redes.
    ports:
      - "8474:8474"
    # A imagem do Toxiproxy é distroless (sem shell), então o healthcheck usa a
    # forma exec (CMD), chamando o CLI embarcado apontado ao API local. Sem
    # shell não há `CMD-SHELL`.
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "localhost:8474", "list"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: "no"

networks:
  # Rede dedicada do Anel. A seção do 2PC (tarefa 6) deve declarar a sua própria
  # rede aqui, sem remover esta nem ligar os Nós do Anel a ela.
  rede-anel:
    name: mc714-t2-rede-anel
    driver: bridge
  # Rede dedicada do 2PC (tarefa 6), independente da rede do Anel.
  rede-2pc:
    name: mc714-t2-rede-2pc
    driver: bridge

volumes:
  # Um volume nomeado por Participante para o seu Log_Duravel (Requisito 7.2),
  # mais um para o Coordenador. Volumes nomeados sobrevivem a `down` sem `-v`,
  # o que sustenta a demonstração de recuperação após reinício (Requisito 6.6).
  log-coordenador:
    name: mc714-t2-log-coordenador
  log-participante-1:
    name: mc714-t2-log-participante-1
  log-participante-2:
    name: mc714-t2-log-participante-2
  log-participante-3:
    name: mc714-t2-log-participante-3
