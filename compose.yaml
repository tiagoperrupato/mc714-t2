# Orquestração do T2 no Docker Compose v2. Os cinco Nós do Anel ficam na rede `rede-anel`, o
# Coordenador e os três Participantes do 2PC na `rede-2pc`, e o Toxiproxy nas duas. Todos os Nós
# usam a mesma imagem (ver Dockerfile), e o `command` de cada serviço escolhe o algoritmo. A
# topologia vem só de variáveis de ambiente.

# Âncoras YAML com a configuração comum aos Nós do Anel. A base define imagem,
# comando e rede. O bloco de ambiente define o ANEL e o mapa de URLS, idênticos
# para todos os Nós. Cada serviço acrescenta apenas o seu NO_ID.
x-no-anel-env: &no-anel-env
  ANEL: "1,2,3,4,5"
  URLS: "1=http://no-anel-1:8000,2=http://no-anel-2:8000,3=http://no-anel-3:8000,4=http://no-anel-4:8000,5=http://no-anel-5:8000"
  PORTA: "8000"
  DEADLINE: "1.0"
  RETRIES: "2"
  SEMENTE: "0"

x-no-anel-base: &no-anel-base
  build:
    context: .
    dockerfile: Dockerfile
  image: mc714-t2:latest
  command: ["python", "-m", "src.anel"]
  networks:
    - rede-anel
  healthcheck:
    test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
    interval: 3s
    timeout: 3s
    retries: 10
    start_period: 2s
  restart: "no"

services:
  # Eleição em Anel: cinco Nós no anel 1 -> 2 -> 3 -> 4 -> 5 -> 1, publicados em 8001..8005
  # para que os scripts e os testes os alcancem do host.
  no-anel-1:
    <<: *no-anel-base
    container_name: no-anel-1
    environment:
      <<: *no-anel-env
      NO_ID: "1"
    ports:
      - "8001:8000"

  no-anel-2:
    <<: *no-anel-base
    container_name: no-anel-2
    environment:
      <<: *no-anel-env
      NO_ID: "2"
    ports:
      - "8002:8000"

  no-anel-3:
    <<: *no-anel-base
    container_name: no-anel-3
    environment:
      <<: *no-anel-env
      NO_ID: "3"
    ports:
      - "8003:8000"

  no-anel-4:
    <<: *no-anel-base
    container_name: no-anel-4
    environment:
      <<: *no-anel-env
      NO_ID: "4"
    ports:
      - "8004:8000"

  no-anel-5:
    <<: *no-anel-base
    container_name: no-anel-5
    environment:
      <<: *no-anel-env
      NO_ID: "5"
    ports:
      - "8005:8000"

  # Two-Phase Commit: um Coordenador e três Participantes, com o mesmo `command`, e
  # `DOISPC_PAPEL` escolhe o papel. Cada Nó monta um volume nomeado próprio em /dados para o seu
  # Log_Duravel, que sobrevive ao reinício do contêiner. O Participante 3 vota NAO, para mostrar o
  # ABORT atômico, e os cenários trocam o voto por override.
  coordenador:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: coordenador
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "coordenador"
      COORD_ID: "1"
      COORD_HOST: "0.0.0.0"
      COORD_PORTA: "8000"
      # Mapa id@host:porta dos Participantes (ids 11, 12, 13).
      DOISPC_PARTICIPANTES: "11@participante-1:8000,12@participante-2:8000,13@participante-3:8000"
      # O prazo de Voto limita a coleta. Ao estourar, o Coordenador decide ABORT.
      DOISPC_DEADLINE_VOTO: "3.0"
      DOISPC_DEADLINE_DECISAO: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/coordenador.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-coordenador:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    depends_on:
      participante-1:
        condition: service_healthy
      participante-2:
        condition: service_healthy
      participante-3:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: "no"

  participante-1:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-1
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "11"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      DOISPC_VOTO: "SIM"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-11.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-1:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8011:8000"
    restart: "no"

  participante-2:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-2
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "12"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      DOISPC_VOTO: "SIM"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-12.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-2:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8012:8000"
    restart: "no"

  participante-3:
    build:
      context: .
      dockerfile: Dockerfile
    image: mc714-t2:latest
    container_name: participante-3
    command: ["python", "-m", "src.doispc"]
    environment:
      DOISPC_PAPEL: "participante"
      PART_ID: "13"
      PART_PORTA: "8000"
      COORD_ID: "1"
      COORD_HOST: "coordenador"
      COORD_PORTA: "8000"
      # Vota NAO para mostrar o ABORT atômico. compose.commit.yaml o troca por SIM.
      DOISPC_VOTO: "NAO"
      DOISPC_DEADLINE: "2.0"
      DOISPC_LOG_DURAVEL: "/dados/participante-13.log"
      SEMENTE: "0"
      LOG_DIR: "/dados/logs"
    volumes:
      - log-participante-3:/dados
    networks:
      - rede-2pc
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/saude', timeout=2).status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    ports:
      - "8013:8000"
    restart: "no"

  # Toxiproxy: proxy TCP nas duas redes. Com o override compose.toxiproxy.yaml, cada Nó alcança o
  # destino pela escuta do Toxiproxy que corresponde a ele, onde scripts/rede.py aplica latência ou
  # desativa o proxy de um Nó, o que corta as Mensagens para ele (partição de entrada). Sem o
  # override, o Toxiproxy só fica no ar e os Nós falam direto entre si.
  #
  # A imagem é pinada numa versão específica (sem :latest) para reprodutibilidade.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    # Sobe o servidor com o HTTP API ouvindo em todas as interfaces, para que os
    # scripts na máquina host (via porta publicada) e os Nós nas redes internas
    # alcancem tanto o API quanto as portas de escuta dos proxies.
    command: ["-host", "0.0.0.0"]
    networks:
      - rede-anel
      - rede-2pc
    # Publica o HTTP API (8474) no host para o `scripts/rede.py` semear proxies e
    # aplicar toxics de fora do compose. As portas de escuta dos proxies não
    # precisam ser publicadas: o tráfego entre Nós é interno às redes.
    ports:
      - "8474:8474"
    # A imagem do Toxiproxy é distroless (sem shell), então o healthcheck usa a
    # forma exec (CMD), chamando o CLI embarcado apontado ao API local. Sem
    # shell não há `CMD-SHELL`.
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "-h", "localhost:8474", "list"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s
    restart: "no"

networks:
  # Redes separadas: um Nó do Anel não alcança um Nó do 2PC.
  rede-anel:
    name: mc714-t2-rede-anel
    driver: bridge
  rede-2pc:
    name: mc714-t2-rede-2pc
    driver: bridge

volumes:
  # Um volume nomeado por Nó do 2PC para o Log_Duravel. Ele sobrevive ao crash e ao start do
  # contêiner, o que sustenta a recuperação do cenário crash-coord, e só some com down -v.
  log-coordenador:
    name: mc714-t2-log-coordenador
  log-participante-1:
    name: mc714-t2-log-participante-1
  log-participante-2:
    name: mc714-t2-log-participante-2
  log-participante-3:
    name: mc714-t2-log-participante-3
